name: Deploy stripe

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy stripe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          if [ -f "stripe/requirements.txt" ]; then
            pip install -r stripe/requirements.txt \
              --platform manylinux2014_x86_64 \
              --python-version 3.13 \
              --only-binary=:all: \
              --target stripe/dependencies/
          fi

      - name: Package integration
        run: |
          cd stripe
          find . \( -name __pycache__ -prune -o -name tests -prune -o -name test -prune \
            -o -name .venv -prune -o -name venv -prune -o -name dependencies -prune \) \
            -o -name "*.py" -print | zip ../stripe.zip -@
          zip ../stripe.zip config.json
          for icon in icon.*; do [ -f "$icon" ] && zip ../stripe.zip "$icon"; done
          if [ -d "dependencies" ]; then zip -r ../stripe.zip dependencies/; fi
          cd ..
          echo "Package: $(du -sh stripe.zip)"

      - name: Deploy
        id: deploy
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.AUTOHIVE_BETA_URL }}/api/v1/integrations/deploy" \
            -H "X-API-Key: ${{ secrets.AUTOHIVE_BETA_DEPLOY_API_KEY }}" \
            -F "zipFile=@stripe.zip" \
            -F "planId=${{ secrets.AUTOHIVE_DEPLOY_PLAN_ID }}" \
            -F "authorMemberId=${{ secrets.AUTOHIVE_DEPLOY_MEMBER_ID }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP: $HTTP_CODE"
          echo "Response: $BODY"

          if [[ "$HTTP_CODE" != "200" ]]; then echo "Deploy failed: HTTP $HTTP_CODE"; exit 1; fi

          SUCCESS=$(echo "$BODY" | jq -r '.success // false')
          if [[ "$SUCCESS" != "true" ]]; then
            echo "Deploy failed: $(echo "$BODY" | jq -r '.error // "unknown"')"
            exit 1
          fi

      - name: Slack success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" \
            -d "{\"text\": \"✅ *stripe* deployed successfully\"}"

      - name: Slack failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" \
            -d "{\"text\": \"❌ *stripe* deploy FAILED — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|logs>\"}"
