# GitHub Actions Workflow Template for Autohive Integration CI/CD
#
# USAGE INSTRUCTIONS:
# ==================
# 1. Copy this file to your integration repository as: `.github/workflows/deploy.yml`
# 2. Replace all occurrences of `xero` with your actual integration folder name
#    Example: If your integration folder is "hubspot_integration", replace `xero` with `hubspot_integration`
#    Quick way: sed -i 's/xero/your_folder_name/g' .github/workflows/deploy.yml
#
# 3. Add the following secrets to your GitHub repository settings:
#    - AUTOHIVE_BETA_DEPLOY_API_KEY: API key for beta environment
#    - AUTOHIVE_PROD_DEPLOY_API_KEY: API key for production environment
#    - AUTOHIVE_BETA_URL: Base URL for beta environment (e.g., https://beta.autohive.com)
#    - AUTOHIVE_PROD_URL: Base URL for production environment (e.g., https://app.autohive.com)
#    - AUTOHIVE_DEPLOY_PLAN_ID: Numeric plan ID for the integration
#    - AUTOHIVE_DEPLOY_MEMBER_ID: Numeric member/author ID for deployments
#    - SLACK_WEBHOOK_URL: Slack webhook URL for notifications

name: Deploy xero Integration

on:
  push:
    branches:
      - main
    paths:
      - 'xero/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine deployment environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "environment=beta" >> $GITHUB_OUTPUT
            echo "Deploying to beta due to push event"
          else
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "Deploying to ${{ github.event.inputs.environment }} due to workflow_dispatch"
          fi

      - name: Set deployment configuration
        id: config
        run: |
          if [[ "${{ steps.set-env.outputs.environment }}" == "beta" ]]; then
            echo "api_key=${{ secrets.AUTOHIVE_BETA_DEPLOY_API_KEY }}" >> $GITHUB_OUTPUT
            echo "base_url=${{ secrets.AUTOHIVE_BETA_URL }}" >> $GITHUB_OUTPUT
          else
            echo "api_key=${{ secrets.AUTOHIVE_PROD_DEPLOY_API_KEY }}" >> $GITHUB_OUTPUT
            echo "base_url=${{ secrets.AUTOHIVE_PROD_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Create integration zip file
        run: |
          cd xero
          zip -r ../xero.zip .
          cd ..
          ls -lh xero.zip

      - name: Deploy integration
        id: deploy
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ steps.config.outputs.base_url }}/api/v1/integrations/deploy" \
            -H "X-API-Key: ${{ steps.config.outputs.api_key }}" \
            -F "zipFile=@xero.zip" \
            -F "planId=${{ secrets.AUTOHIVE_DEPLOY_PLAN_ID }}" \
            -F "authorMemberId=${{ secrets.AUTOHIVE_DEPLOY_MEMBER_ID }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          JSON_RESPONSE=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $JSON_RESPONSE"

          # Check HTTP status
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "error=HTTP $HTTP_CODE" >> $GITHUB_OUTPUT
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Parse JSON response
          SUCCESS=$(echo "$JSON_RESPONSE" | jq -r '.success // false')
          ERROR=$(echo "$JSON_RESPONSE" | jq -r '.error // "Unknown error"')

          if [[ "$SUCCESS" != "true" ]]; then
            echo "error=$ERROR" >> $GITHUB_OUTPUT
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "success=true" >> $GITHUB_OUTPUT

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ xero Integration Deployment Successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *xero Integration Deployment Successful*\n\n*Environment:* ${{ steps.set-env.outputs.environment }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Ref:* ${{ github.ref }}\n*Triggered by:* ${{ github.event_name }}"
                  }
                }
              ]
            }

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ xero Integration Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *xero Integration Deployment Failed*\n\n*Environment:* ${{ steps.set-env.outputs.environment }}\n*Error:* ${{ steps.deploy.outputs.error }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Ref:* ${{ github.ref }}\n*Triggered by:* ${{ github.event_name }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
