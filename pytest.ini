[pytest]
testpaths = .
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: fast, fully mocked tests -- no network access
    integration: end-to-end tests that call a live API and need credentials
    destructive: integration tests that create, mutate, or delete real data
filterwarnings =
    ignore::DeprecationWarning
